url: https://netify-dev.github.io/dbn/
template:
  bootstrap: 5

navbar:
  structure:
    left:  [methodology, articles, reference]
    right: [search, github]
  components:
    methodology:
      text: Methodology
      href: articles/methodology.html
articles:
